<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOES factory | Checkout</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/checkout.css">
    <script src="assets/js/cursor.js"></script>
</head>

<body>
    <div class="navigation">
        <div class="navigationbar">
            <div class="logo">
                <img src="assets/images/LOGO.png" alt="logo">
            </div>
            <div class="center-menu">
                <a href="index.html">Home</a>
                <a href="own.html">Design your own</a>
                <a href="catgory.html">STORE</a>
                <a href="account.html">Account</a>
            </div>
            <div class="info">
                <div id="mySidepanel" class="sidepanel">
                    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
                    <a href="account.html#orders">Order</a>
                    <a href="account.html#wishlist">Whishlist</a>
                </div>
                <div class="mySidepanel2">
                    <button class="openbtn1" onclick="openNav()"><i class='bx bx-menu'></i></button>
                    <div class="cart">
                        <a href="ShowAddtocart.html"><button class="openbtn2"><i class='bx bx-cart'></i></button></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="containercheck">

        <div class="checkout-header">
            <h1>CHECKOUT</h1>
            <a href="#">Continue Browsing</a>
        </div>

        <div class="checkout-form">

            <!-- Right: Order Summary -->
            <div class="order-summary">
                <h2>Order summary (1)</h2>

                <img id="checkout-image" src="" alt="Product Image" width="300">
                <h2 id="checkout-name"></h2>
                <p id="checkout-price"></p>

                <div class="summary-item">
                    <span>Qty: 1</span>
                </div>
                </div>

            <!-- Left: Customer and Delivery Details -->
            <div class="form-section">
                <h2>Customer details</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" name="email" placeholder="Enter your email" required>
                    </div>

                    <div class="form-group">
                        <label>First name *</label>
                        <input type="text" name="firstname" placeholder="First name" required>
                    </div>

                    <div class="form-group">
                        <label>Last name *</label>
                        <input type="text" name="lastname" placeholder="Last name" required>
                    </div>

                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="tel" name="phone" placeholder="Phone number" required>
                    </div>

                    <h2>Delivery details</h2>

                    <div class="form-group">
                        <label>Country/Region *</label>
                        <select name="country" required>
                            <option>India</option>
                            <option>USA</option>
                            <option>UK</option>
                            <option>Australia</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Address *</label>
                        <input type="text" name="address" placeholder="Street Address" required>
                    </div>

                    <div class="form-group">
                        <label>City *</label>
                        <input type="text" name="city" placeholder="City" required>
                    </div>

                    <div class="form-group">
                        <label>Region *</label>
                        <input type="text" name="region" placeholder="Region" required>
                    </div>

                    <div class="form-group">
                        <label>Zip / Postal Code *</label>
                        <input type="text" name="zipcode" required>
                    </div>

                    <button type="button" class="btn" onclick="redirectToOrderSummary()">Continue</button>
                </form>
            </div>
                </div>
    </div>

    <script>
        // Retrieve product details from URL params
        function getQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                image: params.get('image'),
                name: params.get('name'),
                price: params.get('price')
            };
        }

        // Redirect with form data + product details
        function redirectToOrderSummary() {
            const form = document.getElementById('checkout-form');

            // Check if form is valid
            if (!form.checkValidity()) {
                alert("Please fill in all required fields.");
                return;
            }

            const formData = new FormData(form);
            const queryParams = new URLSearchParams(getQueryParams());

            // Append form data to the query string
            for (const [key, value] of formData.entries()) {
                queryParams.append(key, encodeURIComponent(value));
            }

            window.location.href = `order-summary.html?${queryParams.toString()}`;
        }


        // Display product details in checkout page
        window.onload = () => {
            const { image, name, price } = getQueryParams();

            if (image && name && price) {
                document.getElementById('checkout-image').src = image;
                document.getElementById('checkout-name').textContent = name;
                document.getElementById('checkout-price').textContent = `₹${price}.00`;
            }
        };


        function openNav() {
            document.getElementById("mySidepanel").style.width = "250px";
        }

        function closeNav() {
            document.getElementById("mySidepanel").style.width = "0";
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/auth.js"></script>

</html>
