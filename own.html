    <style>
        /* Price Breakdown Dropdown Styling */
        .price-breakdown-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            margin-bottom: 15px;
            overflow: hidden;
            width: 100%;
        }
        
        .price-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            transition: background 0.3s ease;
        }
        
        .price-header:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        .price-header span {
            font-size: 1.1rem;
            color: rgba(255, 255, 255, 0.7);
        }
        
        .price-header i {
            font-size: 1.5rem;
            color: #fff;
            transition: transform 0.3s ease;
        }
        
        .price-details {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            background: rgba(0, 0, 0, 0.2);
        }
        
        .price-details.expanded {
            max-height: 300px;
            padding: 10px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .price-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 20px;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .price-item span:first-child {
            color: rgba(255, 255, 255, 0.8);
        }
        
        .price-item span:last-child {
            font-weight: 500;
            color: #C08552;
        }
    </style>
</head>

    <!-- 3D Model Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/DecalGeometry.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('shoe-3d-container');
            if (!container) return;
            let globalShoeModel = null; // Store model for color changes

            const scene = new THREE.Scene();
            window.globalScene = scene;
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            window.globalCamera = camera;
            camera.position.set(0, 0, 5); // Adjust distance

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, preserveDrawingBuffer: true });
            window.globalRenderer = renderer;
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            const controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = false; // Disable auto rotation
            controls.autoRotateSpeed = 2.0;
            controls.enablePan = false; // Keep it centered
            controls.minDistance = 2; // Prevent zooming too close
            controls.maxDistance = 10; // Prevent zooming too far

            // Lighting setup for high contrast texture and detailing
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
            dirLight.position.set(5, 10, 7);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);

            const fillLight = new THREE.DirectionalLight(0xffffff, 0.6);
            fillLight.position.set(-5, 0, -5);
            scene.add(fillLight);

            // Shadow receiving floor plane
            const planeGeometry = new THREE.PlaneGeometry(100, 100);
            const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.3 });
            const plane = new THREE.Mesh(planeGeometry, planeMaterial);
            plane.rotation.x = -Math.PI / 2;
            plane.position.y = -2; // Position below the shoe
            plane.receiveShadow = true;
            scene.add(plane);

            const loader = new THREE.GLTFLoader();
            // Load the Base64 data directly from the window variable to bypass file:// CORS!
            loader.load(window.sheoModelData, (gltf) => {
                const model = gltf.scene;
                globalShoeModel = model;
                const box = new THREE.Box3().setFromObject(model);

                // Initialize shadows and target colors for smooth transitions
                model.traverse((child) => {
                    if (child.isMesh) {
                        child.castShadow = true;
                        child.receiveShadow = true;
                        if (child.material) {
                            // Clone the material so parts can be colored independently without cross-contamination
                            child.material = Array.isArray(child.material)
                                ? child.material.map(m => m.clone())
                                : child.material.clone();
                                
                            // Store original material for Reset function
                            child.userData.originalMaterial = Array.isArray(child.material)
                                ? child.material.map(m => m.clone())
                                : child.material.clone();

                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => m.targetColor = m.color.clone());
                            } else {
                                child.material.targetColor = child.material.color.clone();
                            }
                        }
                    }
                });

                // If model has geometry, normalize its size to exactly 10 units
                if (!box.isEmpty()) {
                    const size = box.getSize(new THREE.Vector3());
                    const maxDim = Math.max(size.x, size.y, size.z);

                    if (maxDim > 0 && isFinite(maxDim)) {
                        const scale = 10 / maxDim;
                        model.scale.setScalar(scale);
                    }
                }

                // Recompute box after scaling
                const newBox = new THREE.Box3().setFromObject(model);
                const center = newBox.getCenter(new THREE.Vector3());

                // Mathematically center the model at exactly 0,0,0
                model.position.sub(center);

                scene.add(model);

                camera.position.set(0, 2, 15);
                camera.near = 0.1;
                camera.far = 1000;
                camera.updateProjectionMatrix();

                // Point controls at the origin
                controls.target.set(0, 0, 0);
                controls.maxDistance = 100;
                controls.minDistance = 2;
                controls.update();

            }, undefined, function (error) {
                console.error("Error loading model:", error);
            });

            // Adjust cursor on interaction
            container.addEventListener('mousedown', () => container.style.cursor = 'grabbing');
            container.addEventListener('mouseup', () => container.style.cursor = 'grab');

            // --- UI Interaction Logic ---

            // 0. Part Selector Logic
            let activePart = "Upper"; // Default
            const partBtns = document.querySelectorAll('.part-btn');
            partBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    partBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    activePart = btn.getAttribute('data-part');
                });
            });

            // Helper function to check if a mesh belongs to the active part
            function isMeshInActivePart(meshName, part) {
                if (!meshName) return true; // Fallback

                const soleMeshes = ["Object_24", "Object_25", "Object_26"];
                const insoleMeshes = ["Object_28"];
                const logoMeshes = ["Object_18"];
                const heelMeshes = ["Object_19"];
                const accessoriesMeshes = ["Object_5"];
                const laceMeshes = ["Object_7", "Object_9", "Object_11", "Object_13", "Object_15"];
                const tongueMeshes = ["Object_22"];

                if (part === "Sole") return soleMeshes.includes(meshName);
                if (part === "Insole") return insoleMeshes.includes(meshName);
                if (part === "Logo") return logoMeshes.includes(meshName);
                if (part === "Heel") return heelMeshes.includes(meshName);
                if (part === "Accessories") return accessoriesMeshes.includes(meshName);
                if (part === "Laces") return laceMeshes.includes(meshName);
                if (part === "Tongue") return tongueMeshes.includes(meshName);

                // For "Upper", return true for everything else NOT mapped above
                return !(soleMeshes.includes(meshName) || insoleMeshes.includes(meshName) || logoMeshes.includes(meshName) || heelMeshes.includes(meshName) || accessoriesMeshes.includes(meshName) || laceMeshes.includes(meshName) || tongueMeshes.includes(meshName));
            }

            // --- Dynamic Pricing Logic ---
            let basePrice = 1500;
            let modifications = {}; // stores part -> { color: null, material: null }

            const priceHeader = document.getElementById('priceHeader');
            const priceDetails = document.getElementById('priceDetails');
            const priceDropdownIcon = document.getElementById('priceDropdownIcon');
            const dynamicPriceList = document.getElementById('dynamicPriceList');
            const totalPriceVal = document.getElementById('totalPriceVal');
            const mainPriceTitle = document.querySelector('.configurator-price');

            priceHeader.addEventListener('click', () => {
                priceDetails.classList.toggle('expanded');
                if (priceDetails.classList.contains('expanded')) {
                    priceDropdownIcon.classList.replace('bx-chevron-down', 'bx-chevron-up');
                } else {
                    priceDropdownIcon.classList.replace('bx-chevron-up', 'bx-chevron-down');
                }
            });

            function updatePriceUI() {
                let total = basePrice;
                dynamicPriceList.innerHTML = '';

                for (const part in modifications) {
                    const mods = modifications[part];
                    if (mods.color) {
                        total += mods.color.cost;
                        const div = document.createElement('div');
                        div.className = 'price-item';
                        div.innerHTML = `<span>${part} (${mods.color.name})</span><span>+₹ ${mods.color.cost} <i class='bx bx-x' onclick="removeModification('${part}', 'color')" style="cursor:pointer; color:#e74c3c; font-size:1.1rem; vertical-align:middle; margin-left:4px;" title="Remove"></i></span>`;
                        dynamicPriceList.appendChild(div);
                    }
                    if (mods.material) {
                        total += mods.material.cost;
                        const div = document.createElement('div');
                        div.className = 'price-item';
                        div.innerHTML = `<span>${part} (${mods.material.name})</span><span>+₹ ${mods.material.cost} <i class='bx bx-x' onclick="removeModification('${part}', 'material')" style="cursor:pointer; color:#e74c3c; font-size:1.1rem; vertical-align:middle; margin-left:4px;" title="Remove"></i></span>`;
                        dynamicPriceList.appendChild(div);
                    }
                }

                totalPriceVal.innerText = `₹ ${total.toLocaleString()}`;
                totalPriceVal.setAttribute('data-price', total); // Store raw number to avoid locale parsing issues
                if (mainPriceTitle) mainPriceTitle.innerText = `₹ ${total.toLocaleString()}`;
            }

            window.removeModification = function (part, type) {
                if (modifications[part]) {
                    delete modifications[part][type];
                }

                if (part === 'Custom Artwork') {
                    if (activeDecal) { scene.remove(activeDecal); activeDecal = null; }
                    if (typeof lockedDecals !== 'undefined') {
                        lockedDecals.forEach(decal => scene.remove(decal));
                        lockedDecals = [];
                    }
                } else if (globalShoeModel) {
                    globalShoeModel.traverse((child) => {
                        if (child.isMesh && child.userData.originalMaterial && isMeshInActivePart(child.name, part)) {
                            const restoreProps = (m, origM) => {
                                if (type === 'color') {
                                    m.targetColor = origM.color.clone();
                                    m.color.copy(origM.color);
                                    if (m.emissiveIntensity > 0) m.emissive.copy(m.color); // Sync emissive if glowing
                                } else if (type === 'material') {
                                    m.roughness = origM.roughness;
                                    m.metalness = origM.metalness;
                                    m.emissive = origM.emissive ? origM.emissive.clone() : new THREE.Color(0x000000);
                                    m.emissiveIntensity = origM.emissiveIntensity || 0;
                                }
                                m.needsUpdate = true;
                            };

                            if (Array.isArray(child.material)) {
                                child.material.forEach((m, i) => restoreProps(m, child.userData.originalMaterial[i]));
                            } else {
                                restoreProps(child.material, child.userData.originalMaterial);
                            }
                        }
                    });
                }
                updatePriceUI();
            };

            function setModification(part, type, name, cost) {
                if (!modifications[part]) modifications[part] = { color: null, material: null };
                modifications[part][type] = { name, cost };
                updatePriceUI();
            }

            // 1. Color Swatches (Smooth Target Color)
            const swatches = document.querySelectorAll('.color-swatch-container');
            swatches.forEach(swatchContainer => {
                swatchContainer.addEventListener('click', () => {
                    swatches.forEach(s => s.classList.remove('active'));
                    swatchContainer.classList.add('active');

                    if (globalShoeModel) {
                        const swatchDiv = swatchContainer.querySelector('.color-swatch');
                        if (swatchDiv) {
                            const colorName = swatchContainer.querySelector('.color-label').innerText;
                            setModification(activePart, 'color', colorName, 250);

                            const colorStr = window.getComputedStyle(swatchDiv).backgroundColor;
                            const threeColor = new THREE.Color(colorStr);

                            globalShoeModel.traverse((child) => {
                                if (child.isMesh && child.material && isMeshInActivePart(child.name, activePart)) {
                                    if (Array.isArray(child.material)) {
                                        child.material.forEach(m => m.targetColor = threeColor.clone());
                                    } else {
                                        child.material.targetColor = threeColor.clone();
                                    }
                                }
                            });
                        }
                    }
                });
            });

            // Infinite Color Picker logic
            const infiniteColorPicker = document.getElementById('infiniteColorPicker');
            const customColorContainer = document.getElementById('customColorContainer');
            if (infiniteColorPicker) {
                infiniteColorPicker.addEventListener('input', (e) => {
                    swatches.forEach(s => s.classList.remove('active'));
                    customColorContainer.classList.add('active');

                    setModification(activePart, 'color', 'Infinite Custom', 500);

                    if (globalShoeModel) {
                        const threeColor = new THREE.Color(e.target.value);
                        globalShoeModel.traverse((child) => {
                            if (child.isMesh && child.material && isMeshInActivePart(child.name, activePart)) {
                                if (Array.isArray(child.material)) {
                                    child.material.forEach(m => m.targetColor = threeColor.clone());
                                } else {
                                    child.material.targetColor = threeColor.clone();
                                }
                            }
                        });
                    }
                });
            }

            // 2. Material Pills (Roughness/Metalness)
            const materialPills = document.querySelectorAll('.material-pill');
            materialPills.forEach(pill => {
                pill.addEventListener('click', () => {
                    materialPills.forEach(p => p.classList.remove('active'));
                    pill.classList.add('active');

                    let r = 0.5, m = 0.5;
                    let isGlow = false;
                    let matCost = 400;
                    const type = pill.innerText.trim();
                    if (type === 'Matte Leather') { r = 0.8; m = 0.1; matCost = 400; }
                    else if (type === 'Gloss Plastic') { r = 0.1; m = 0.5; matCost = 300; }
                    else if (type === 'Suede') { r = 1.0; m = 0.0; matCost = 600; }
                    else if (type === 'Metallic') { r = 0.2; m = 0.9; matCost = 800; }
                    else if (type === 'Glow Effect') { r = 0.4; m = 0.2; isGlow = true; matCost = 1500; }

                    setModification(activePart, 'material', type, matCost);

                    if (globalShoeModel) {
                        globalShoeModel.traverse((child) => {
                            if (child.isMesh && child.material && isMeshInActivePart(child.name, activePart)) {
                                const applyMaterialProperties = (mat) => {
                                    mat.roughness = r;
                                    mat.metalness = m;
                                    if (isGlow) {
                                        mat.emissive = mat.targetColor || mat.color;
                                        mat.emissiveIntensity = 2.0;
                                    } else {
                                        mat.emissive = new THREE.Color(0x000000);
                                        mat.emissiveIntensity = 0;
                                    }
                                    mat.needsUpdate = true;
                                };

                                if (Array.isArray(child.material)) {
                                    child.material.forEach(applyMaterialProperties);
                                } else {
                                    applyMaterialProperties(child.material);
                                }
                            }
                        });
                    }
                });
            });

            // 3. Camera Presets
            let targetCameraPosition = null;
            let isAutoRotating = false;
            const cameraPresets = {
                'side': new THREE.Vector3(0, 2, 15),
                'top': new THREE.Vector3(0, 15, 0),
                'heel': new THREE.Vector3(0, 2, -15)
            };

            const presetBtns = document.querySelectorAll('.preset-btn');
            presetBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    presetBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    const preset = btn.getAttribute('data-preset');
                    if (preset === '360') {
                        isAutoRotating = true;
                        targetCameraPosition = null;
                    } else {
                        isAutoRotating = false;
                        if (cameraPresets[preset]) {
                            targetCameraPosition = cameraPresets[preset].clone();
                        }
                    }
                });
            });

            // 4. Decal Logic
            let decalTexture = null;
            let activeDecal = null;
            let lockedDecals = [];
            let isPlacingDecal = false;
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            let intersection = null;

            const decalParams = {
                position: new THREE.Vector3(),
                orientation: new THREE.Euler(),
                size: new THREE.Vector3(10, 10, 10),
                scale: 10,
                rotation: 0
            };

            const uploadInput = document.getElementById('designUpload');
            const decalEditor = document.getElementById('decalEditor');

            uploadInput.addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = new Image();
                    img.onload = () => {
                        const tex = new THREE.Texture(img);
                        tex.needsUpdate = true;
                        decalTexture = tex;
                        isPlacingDecal = true;
                        controls.enabled = false; // Disable camera orbit to allow mouse dragging
                        decalEditor.classList.add('visible');
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            });

            function checkIntersection(x, y) {
                if (!globalShoeModel) return;
                const rect = container.getBoundingClientRect();
                mouse.x = ((x - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((y - rect.top) / rect.height) * 2 + 1;
                raycaster.setFromCamera(mouse, camera);

                const intersects = raycaster.intersectObject(globalShoeModel, true);
                if (intersects.length > 0) {
                    intersection = intersects[0];
                } else {
                    intersection = null;
                }
            }

            function updateDecal() {
                if (!intersection || !decalTexture || !intersection.face) return;

                if (activeDecal) {
                    scene.remove(activeDecal);
                }

                const n = intersection.face.normal.clone();
                n.transformDirection(intersection.object.matrixWorld);
                n.multiplyScalar(-1); // Look INWARD to prevent mirrored texture
                n.add(intersection.point);

                decalParams.position.copy(intersection.point);
                const matrix = new THREE.Matrix4();
                matrix.lookAt(decalParams.position, n, THREE.Object3D.DefaultUp);
                decalParams.orientation.setFromRotationMatrix(matrix);

                decalParams.orientation.z = (decalParams.rotation * Math.PI) / 180;

                decalParams.size.setScalar(decalParams.scale);
                decalParams.size.z = 2; // Reduced depth to prevent piercing through whole shoe

                const material = new THREE.MeshStandardMaterial({
                    map: decalTexture,
                    transparent: true,
                    alphaTest: 0.5, // Removes Z-fighting on transparent parts of the decal
                    depthTest: true,
                    depthWrite: false,
                    polygonOffset: true,
                    polygonOffsetFactor: -4,
                    wireframe: false
                });

                const decalGeom = new THREE.DecalGeometry(intersection.object, intersection.point, decalParams.orientation, decalParams.size);
                activeDecal = new THREE.Mesh(decalGeom, material);
                scene.add(activeDecal);
            }

            container.addEventListener('pointermove', (e) => {
                if (isPlacingDecal && decalTexture) {
                    checkIntersection(e.clientX, e.clientY);
                    if (intersection) {
                        updateDecal();
                    }
                }
            });

            document.getElementById('decalSize').addEventListener('input', (e) => {
                decalParams.scale = parseFloat(e.target.value);
                document.getElementById('decalSizeVal').innerText = e.target.value;
                if (isPlacingDecal) updateDecal();
            });
            document.getElementById('decalRot').addEventListener('input', (e) => {
                decalParams.rotation = parseFloat(e.target.value);
                document.getElementById('decalRotVal').innerText = e.target.value + '°';
                if (isPlacingDecal) updateDecal();
            });

            // Keyboard/Mouse Shortcuts for Decals
            window.addEventListener('wheel', (e) => {
                if (isPlacingDecal && e.ctrlKey) {
                    e.preventDefault(); // Prevent page zooming
                    // Adjust rotation (e.deltaY > 0 means scroll down, rotate one way)
                    decalParams.rotation += (e.deltaY > 0 ? 5 : -5);
                    // Keep rotation between 0 and 360
                    if (decalParams.rotation >= 360) decalParams.rotation -= 360;
                    if (decalParams.rotation < 0) decalParams.rotation += 360;

                    document.getElementById('decalRot').value = decalParams.rotation;
                    document.getElementById('decalRotVal').innerText = decalParams.rotation + '°';
                    updateDecal();
                }
            }, { passive: false });

            window.addEventListener('keydown', (e) => {
                if (isPlacingDecal) {
                    if (e.ctrlKey && e.key === 'Enter') {
                        e.preventDefault();
                        document.getElementById('lockDecalBtn').click();
                    } else if (e.key === '+' || e.key === '=') {
                        decalParams.scale = Math.min(50, decalParams.scale + 1);
                        document.getElementById('decalSize').value = decalParams.scale;
                        document.getElementById('decalSizeVal').innerText = decalParams.scale;
                        updateDecal();
                    } else if (e.key === '-' || e.key === '_') {
                        decalParams.scale = Math.max(1, decalParams.scale - 1);
                        document.getElementById('decalSize').value = decalParams.scale;
                        document.getElementById('decalSizeVal').innerText = decalParams.scale;
                        updateDecal();
                    }
                }
            });

            document.getElementById('lockDecalBtn').addEventListener('click', () => {
                isPlacingDecal = false;
                if (activeDecal) {
                    lockedDecals.push(activeDecal);
                    activeDecal = null; // Lock it in
                }
                controls.enabled = true;
                decalEditor.classList.remove('visible');
                uploadInput.value = '';

                // Add premium pricing cost for custom uploaded artwork!
                if (typeof setModification === 'function') {
                    setModification('Custom Artwork', 'material', 'Uploaded Decal', 1000);
                }
            });

            // --- Reset Design Logic ---
            document.getElementById('resetBtn').addEventListener('click', () => {
                if (globalShoeModel) {
                    globalShoeModel.traverse((child) => {
                        if (child.isMesh && child.userData.originalMaterial) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach((m, i) => {
                                    m.copy(child.userData.originalMaterial[i]);
                                    m.targetColor = m.color.clone();
                                    m.needsUpdate = true;
                                });
                            } else {
                                child.material.copy(child.userData.originalMaterial);
                                child.material.targetColor = child.material.color.clone();
                                child.material.needsUpdate = true;
                            }
                        }
                    });
                }
                modifications = {};
                if (activeDecal) { scene.remove(activeDecal); activeDecal = null; }
                if (typeof lockedDecals !== 'undefined') {
                    lockedDecals.forEach(decal => scene.remove(decal));
                    lockedDecals = [];
                }
                updatePriceUI();
                swatches.forEach(s => s.classList.remove('active'));
                materialPills.forEach(p => p.classList.remove('active'));
                if (customColorContainer) customColorContainer.classList.remove('active');
            });

            // --- Animation Loop ---
            function animate() {
                requestAnimationFrame(animate);

                // Camera Interpolation
                if (isAutoRotating) {
                    controls.autoRotate = true;
                    controls.update();
                } else {
                    controls.autoRotate = false;
                    controls.update();
                    if (targetCameraPosition) {
                        camera.position.lerp(targetCameraPosition, 0.05);
                        if (camera.position.distanceTo(targetCameraPosition) < 0.1) {
                            targetCameraPosition = null;
                        }
                    }
                }

                // Smooth Color Transitions
                if (globalShoeModel) {
                    globalShoeModel.traverse((child) => {
                        if (child.isMesh && child.material) {
                            if (Array.isArray(child.material)) {
                                child.material.forEach(m => {
                                    if (m.targetColor) {
                                        m.color.lerp(m.targetColor, 0.1);
                                        if (m.emissiveIntensity > 0) m.emissive.copy(m.color); // Sync glow with color
                                    }
                                });
                            } else {
                                if (child.material.targetColor) {
                                    child.material.color.lerp(child.material.targetColor, 0.1);
                                    if (child.material.emissiveIntensity > 0) child.material.emissive.copy(child.material.color); // Sync glow with color
                                }
                            }
                        }
                    });
                }

                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                if (!container) return;
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });

            // Expose function to capture angles and get modifications for the cart
            window.getCustomShoeData = function() {
                if (!window.globalRenderer || !window.globalScene || !window.globalCamera) return null;
                
                const originalPos = window.globalCamera.position.clone();
                const originalAutoRotate = controls.autoRotate;
                controls.autoRotate = false;
                
                // Front, Right, Back, Left
                const angles = [
                    new THREE.Vector3(0, 2, 15),
                    new THREE.Vector3(15, 2, 0),
                    new THREE.Vector3(0, 2, -15),
                    new THREE.Vector3(-15, 2, 0)
                ];
                
                const captures = [];
                for (const pos of angles) {
                    window.globalCamera.position.copy(pos);
                    window.globalCamera.lookAt(0, 0, 0);
                    window.globalRenderer.render(window.globalScene, window.globalCamera);
                    captures.push(window.globalRenderer.domElement.toDataURL("image/jpeg", 0.6));
                }
                
                // Restore camera
                window.globalCamera.position.copy(originalPos);
                window.globalCamera.lookAt(0, 0, 0);
                controls.autoRotate = originalAutoRotate;
                window.globalRenderer.render(window.globalScene, window.globalCamera);
                
                return { images: captures, modifications: JSON.parse(JSON.stringify(modifications)) };
            };
        });
    </script>
    <!-- Drawer Toggle Script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const openBtn = document.getElementById('changeShoeBtn');
            const closeBtn = document.getElementById('closeDrawerBtn');
            const drawer = document.getElementById('shoeDrawer');

            if (openBtn && closeBtn && drawer) {
                openBtn.addEventListener('click', () => {
                    drawer.classList.add('open');
                });

                closeBtn.addEventListener('click', () => {
                    drawer.classList.remove('open');
                });
            }
        });
        function openNav() {
            document.getElementById("mySidepanel").style.width = "250px";
        }
        function closeNav() {
            document.getElementById("mySidepanel").style.width = "0";
        }

        function addCustomShoeToCart() {
            try {
                const totalEl = document.getElementById('totalPriceVal');
                let price = 1500;
                if (totalEl) {
                    const rawPrice = totalEl.getAttribute('data-price');
                    if (rawPrice) {
                        price = parseInt(rawPrice, 10);
                    } else {
                        const extracted = parseInt(totalEl.innerText.replace(/[^\d]/g, ''));
                        if (!isNaN(extracted)) price = extracted;
                    }
                }
                
                let customData = null;
                if (typeof window.getCustomShoeData === 'function') {
                    customData = window.getCustomShoeData();
                }
                
                if(typeof openBuyPopup === 'function') {
                    openBuyPopup('assets/images/shoes/s3.png', 'Custom Design Shoe', price, customData);
                } else if(typeof addToCart === 'function') {
                    addToCart('assets/images/shoes/s3.png', 'Custom Design Shoe', price, customData);
                } else {
                    alert(`Custom Design Shoe added to cart! Price: Rs. ${price}`);
                }
            } catch (err) {
                console.error("Error adding to cart:", err);
            }
        }

        function addCustomShoeToWishlist() {
            try {
                const totalEl = document.getElementById('totalPriceVal');
                let price = 1500;
                if (totalEl) {
                    const rawPrice = totalEl.getAttribute('data-price');
                    if (rawPrice) {
                        price = parseInt(rawPrice, 10);
                    } else {
                        const extracted = parseInt(totalEl.innerText.replace(/[^\d]/g, ''));
                        if (!isNaN(extracted)) price = extracted;
                    }
                }
                
                let customData = null;
                if (typeof window.getCustomShoeData === 'function') {
                    customData = window.getCustomShoeData();
                }

                let wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                const itemName = "Custom Design Shoe";
                const imageSrc = (customData && customData.images) ? customData.images[0] : 'assets/images/shoes/s3.png';
                
                wishlist.push({
                    itemName,
                    price,
                    imageSrc,
                    customData,
                    addedAt: new Date().getTime()
                });
                
                localStorage.setItem('wishlist', JSON.stringify(wishlist));
                window.location.href = 'account.html#wishlist';
            } catch (err) {
                console.error("Error adding to wishlist:", err);
            }
        }
        
        // Auto-load design if editing from wishlist
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.has('editWishlist')) {
                const index = parseInt(urlParams.get('editWishlist'));
                const wishlist = JSON.parse(localStorage.getItem('wishlist')) || [];
                const item = wishlist[index];
                
                if(item && item.customData && item.customData.modifications) {
                    const applyMods = () => {
                        for(const part in item.customData.modifications) {
                            const mods = item.customData.modifications[part];
                            
                            // Click the part pill to make it active
                            const partBtns = document.querySelectorAll('.part-btn');
                            partBtns.forEach(btn => {
                                if(btn.innerText.trim() === part) btn.click();
                            });
                            
                            // Click the color swatch
                            if(mods.color) {
                                const swatches = document.querySelectorAll('.color-swatch-container');
                                swatches.forEach(swatch => {
                                    const label = swatch.querySelector('.color-label');
                                    if(label && label.innerText.trim() === mods.color.name) {
                                        swatch.click();
                                    }
                                });
                            }
                            
                            // Click the material pill
                            if(mods.material) {
                                const mats = document.querySelectorAll('.material-pill');
                                mats.forEach(mat => {
                                    if(mat.innerText.trim() === mods.material.name) {
                                        mat.click();
                                    }
                                });
                            }
                        }
                    };
                    
                    // Wait for 3D model to load
                    const checkModel = setInterval(() => {
                        if(window.globalShoeModel) {
                            clearInterval(checkModel);
                            // Give it a small delay for UI rendering
                            setTimeout(applyMods, 200);
                        }
                    }, 200);
                }
            }
        });
    </script>
