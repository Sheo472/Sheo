<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOES factory | Checkout Cart</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/checkout-cart.css"> <!-- Link your CSS file -->
<script src="assets/js/cursor.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</head>
<body>

        <div class="navigation">
        <div class="navigationbar">
            <div class="logo">
                <img src="assets/images/LOGO.png" alt="logo">
            </div>
            <div class="center-menu">
                <a href="index.html">Home</a>
                <a href="own.html">Design your own</a>
                <a href="catgory.html">STORE</a>
                <a href="javascript:void(0)" onclick="handleAccountNavigation()">Account</a>
            </div>
            <div class="info">
                <div id="mySidepanel" class="sidepanel">
                    <a href="javascript:void(0)" class="closebtn" onclick="closeNav()">×</a>
                    <a href="account.html#orders">Order</a>
                    <a href="account.html#wishlist">Whishlist</a>
                </div>
                <div class="mySidepanel2">
                    <button class="openbtn1" onclick="openNav()"><i class='bx bx-menu'></i></button>
                    <div class="cart">
                        <a href="ShowAddtocart.html"><button class="openbtn2"><i class='bx bx-cart'></i></button></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="containercheckout">

        <!-- Order Summary Section -->
        <div class="summary-section">
            <h2>Order Summary</h2>
            <div id="order-summary"></div>

            <p><strong>Items Total: <span id="totalAmount">Rs 0</span></strong></p>
            <p>Delivery: <strong>Free</strong></p>
            <p>Taxes: <strong>Rs 0.00</strong></p>
            <hr>
            <p><strong>Total: <span id="finalTotal">Rs 0</span></strong></p>
                </div>
        <!-- Customer Details Form -->
        <div class="form-section">
            <h2>Customer Details</h2>
            <div class="input-group">
                <label>Email *</label>
                <input type="email" required>
            </div>
            <div class="input-group">
                <label>First Name *</label>
                <input type="text" required>
            </div>
            <div class="input-group">
                <label>Last Name *</label>
                <input type="text" required>
            </div>
            <div class="input-group">
                <label>Phone *</label>
                <input type="text" required>
            </div>

            <h2>Delivery Details</h2>
            <div class="input-group">
                <label>Country/Region *</label>
                <select>
                    <option value="India">India</option>
                </select>
            </div>
            <div class="input-group">
                <label>Address *</label>
                <input type="text" required>
            </div>
            <div class="input-group">
                <label>City *</label>
                <input type="text" required>
            </div>
            <div class="input-group">
                <label>Region *</label>
                <select>
                    <option value="Gujarat">Gujarat</option>
                </select>
            </div>
            <div class="input-group">
                <label>Zip / Postal Code *</label>
                <input type="text" required>
            </div>
            <button class="checkout-btn" onclick="completePurchase()">Place Order</button>
        </div>
                </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const cart = JSON.parse(localStorage.getItem('cart')) || {};
            const orderSummary = document.getElementById('order-summary');
            let totalPrice = 0;

            orderSummary.innerHTML = ""; // Clear previous data

            for (const [itemName, itemData] of Object.entries(cart)) {
                const { imageSrc, price, quantity } = itemData;
                const subtotal = price * quantity;
                totalPrice += subtotal;

                const itemElement = document.createElement("div");
                itemElement.classList.add("order-item");
                itemElement.innerHTML = `
                    <img src="${imageSrc}" alt="${itemName}">
                    <div>
                        <p><strong>${itemName}</strong></p>
                        <p>Rs ${price} x ${quantity}</p>
                    </div>
                    <p><strong>Rs ${subtotal.toFixed(2)}</strong></p>
                `;
                orderSummary.appendChild(itemElement);
            }

            // Update total price
            document.getElementById('totalAmount').textContent = `Rs ${totalPrice.toFixed(2)}`;
            document.getElementById('finalTotal').textContent = `Rs ${totalPrice.toFixed(2)}`;
        });

        function completePurchase() {
            const inputs = document.querySelectorAll('.form-section input[required], .form-section select[required]');
            
            let isValid = true;
            inputs.forEach(input => {
                if (!input.value.trim()) {
                    isValid = false;
                    input.style.border = "2px solid red"; // Highlight empty fields
                } else {
                    input.style.border = "1px solid #ccc"; // Reset border for filled fields
                }
            });
        
            if (!isValid) {
                alert("Please fill in all required fields before placing your order.");
                return;
            }
            
            // Calculate total from cart
            const cart = JSON.parse(localStorage.getItem('cart')) || {};
            let checkoutTotal = 0;
            for (const item of Object.values(cart)) {
                checkoutTotal += item.price * item.quantity;
            }
            
            if (checkoutTotal === 0) {
                alert("Your cart is empty!");
                return;
            }
            
            // Razorpay options
            var options = {
                "key": "rzp_test_TMguU1JgALAZwo", // Replace with your Razorpay Test API Key
                "amount": checkoutTotal * 100, // Amount is in currency subunits (paise for INR)
                "currency": "INR",
                "name": "S.H.O.E.S Factory",
                "description": "Test Transaction",
                "image": "assets/images/LOGO.png",
                "handler": function (response){
                    alert("Payment successful! Payment ID: " + response.razorpay_payment_id);
                    localStorage.removeItem("cart"); // Clear cart data
                    window.location.href = "index.html"; // Redirect to home or thank you page
                },
                "prefill": {
                    "name": inputs[1].value + " " + inputs[2].value, // First + Last name
                    "email": inputs[0].value,
                    "contact": inputs[3].value
                },
                "theme": {
                    "color": "#C08552"
                }
            };
            
            var rzp1 = new Razorpay(options);
            rzp1.on('payment.failed', function (response){
                    alert("Payment Failed! Reason: " + response.error.description);
            });
            rzp1.open();
        }


        function openNav() {
            document.getElementById("mySidepanel").style.width = "250px";
          }
          
          function closeNav() {
            document.getElementById("mySidepanel").style.width = "0";
          }
        
    </script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/auth.js"></script>
</html>
